name: build-and-test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: RutaViva_CI2026!Temporary
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'RutaViva_CI2026!Temporary' -C -Q 'SELECT 1' -b"
          --health-interval=10s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test backend/RutaViva.sln -c Release
        env:
          RUTAVIVA_TEST_SQL: Server=localhost;Database=master;User Id=sa;Password=RutaViva_CI2026!Temporary;TrustServerCertificate=True;Encrypt=True
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
